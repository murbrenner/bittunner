name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Permite disparar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
        apt-get install -y autoconf libtool pkg-config libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        apt-get install -y openjdk-11-jdk automake libtool libncurses5-dev libncursesw5-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kivy[base]
        pip install buildozer
        pip install cython
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = BitTuner
        package.name = bittuner
        package.domain = org.bittuner
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,txt
        version = 1.0.0
        requirements = python3,kivy,yt-dlp,certifi,pyjnius,android
        android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
        android.api = 30
        android.minapi = 21
        android.ndk = 28c
        android.sdk = 30
        android.entrypoint = org.kivy.android.PythonActivity
        android.archs = arm64-v8a,armeabi-v7a
        android.fullscreen = False
        
        [buildozer]
        log_level = 2
        EOF
    
    - name: Build APK
      run: |
        mkdir -p ~/.android
        yes | sdkmanager --licenses || true
        buildozer android debug
      continue-on-error: true
    
    - name: List build output
      run: |
        ls -la
        ls -la bin/ || echo "bin directory not found"
        find . -name "*.apk" || echo "No APK files found"
    
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bittuner-apk
        path: |
          bin/*.apk
          *.apk
        retention-days: 30
        if-no-files-found: warn
